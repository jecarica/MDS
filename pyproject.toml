[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mds"
version = "0.1.0"
description = "Message minibatch and file-bucketing processing system"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
